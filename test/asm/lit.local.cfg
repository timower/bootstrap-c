import os
import platform


qemu_cmd = "qemu-arm"
# Check if we need to specify library path for qemu (e.g., in CI environments)
if os.path.exists("/usr/arm-linux-gnueabihf"):
    qemu_cmd += " -L /usr/arm-linux-gnueabihf"

if platform.system() == "Darwin":
    config.substitutions.append(("%cc", "true"))
    config.substitutions.append(("%run", "true"))
    config.substitutions.insert(0, ("%check-exit-code", "true"))
else:
    config.substitutions.append(("%cc", "armv7l-unknown-linux-gnueabihf-gcc"))
    config.substitutions.append(("%run", qemu_cmd))
