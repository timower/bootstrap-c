import os
import platform

import lit.formats
import lit.TestingConfig


def configure(config: lit.TestingConfig.TestingConfig):
    config.name = "Bootstrap"
    config.test_format = lit.formats.ShTest()

    config.suffixes = set([".b"])

    config.environment["ASAN_OPTIONS"] = "detect_leaks=0"

    test_dir = os.path.dirname(__file__)
    root_dir = os.path.dirname(test_dir)

    boostrap_name = os.environ.get("BOOTSTRAP", "bootstrap")

    # Platform-aware substitutions
    system = platform.system().lower()
    machine = platform.machine().lower()

    # Determine if we're on native ARM64 or need cross-compilation
    if machine in ["arm64", "aarch64"]:
        # Native ARM64 Darwin - use native tools
        config.substitutions.append(("%cc", "cc"))
        config.substitutions.append(("%run", ""))
        config.substitutions.append(
            ("%bootstrap", os.path.join(root_dir, boostrap_name) + " -target darwin")
        )
    else:
        # Cross-compilation scenario - use ARM64 cross-compiler and qemu
        config.substitutions.append(("%cc", "aarch64-unknown-linux-gnu-gcc"))
        config.substitutions.append(("%run", "qemu-aarch64"))
        config.substitutions.append(
            ("%bootstrap", os.path.join(root_dir, boostrap_name))
        )

    config.substitutions.append(
        ("%check-exit-code", "bash " + os.path.join(test_dir, "check-exit-code.sh"))
    )

    config.available_features.add(f"system-{system}")


configure(config)  # noqa # type: ignore
