import os
import platform

import lit.formats
import lit.TestingConfig


def configure(config: lit.TestingConfig.TestingConfig):
    config.name = "Bootstrap"
    config.test_format = lit.formats.ShTest()

    config.suffixes = set([".b"])

    test_dir = os.path.dirname(__file__)
    root_dir = os.path.dirname(test_dir)

    config.environment["ASAN_OPTIONS"] = "detect_leaks=0"
    config.environment["LLVM_PROFILE_FILE"] = os.path.join(
        root_dir, "build", "coverage", "%p.profraw"
    )

    boostrap_name = os.environ.get("BOOTSTRAP", "bootstrap")

    config.substitutions.append(("%bootstrap", os.path.join(root_dir, boostrap_name)))

    config.substitutions.append(
        ("%check-exit-code", "bash " + os.path.join(test_dir, "check-exit-code.sh"))
    )

    system = platform.system().lower()
    config.available_features.add(f"system-{system}")

    # Compile a binary with covearge, this should match bootstrap-coverage in
    # the Makefile.
    config.substitutions.append(
        (
            "%gen-coverage",
            "opt -p simplifycfg |"
            + " opt -p pgo-instr-gen,instrprof |"
            + " clang -Xclang -disable-llvm-passes -x ir - -fprofile-instr-generate -o",
        )
    )


configure(config)  # noqa # type: ignore
