name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nix-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix build
    - run: nix flake check -L

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install LLVM
      run: |
        sudo apt-get update
        sudo apt-get install lld llvm python3-pip python3-venv gcc-arm-linux-gnueabihf qemu-user golang tree-sitter-cli
        sudo update-alternatives --install /usr/bin/FileCheck FileCheck /usr/bin/FileCheck-18  1
        sudo update-alternatives --install /usr/bin/split-file split-file /usr/bin/split-file-18  1
        sudo update-alternatives --install /usr/bin/armv7l-unknown-linux-gnueabihf-gcc armv7l-unknown-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc 1

    - name: Setup python and lit
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip3 install lit psutil

    - name: Cache Stages
      id: cache-stages
      uses: actions/cache@v4
      with:
        path: cache/*
        key: ${{ runner.os }}-stages

    - name: make
      run: make

    - name: make test
      run: |
        source .venv/bin/activate
        make test
